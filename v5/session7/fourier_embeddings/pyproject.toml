[project]
name = "fourier-embeddings"
version = "0.1.0"
description = "Kronecker vs. Fourier-Kronecker byte-level embeddings: a controlled transformer LM comparison"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.20",
    "aim>=3.25",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "pytest>=8.0",
]

[project.scripts]
fe-download-data = "fourier_embeddings.data.download:main"
fe-train-tokenizer = "fourier_embeddings.data.tokenizer:main"
fe-pack-dataset = "fourier_embeddings.data.dataset:main"
fe-train = "fourier_embeddings.training.train:main"
fe-run-experiment = "fourier_embeddings.training.run_experiment:main"
fe-collisions = "fourier_embeddings.analysis.collisions:main"
fe-order-sensitivity = "fourier_embeddings.analysis.order_sensitivity:main"
fe-crosstalk = "fourier_embeddings.analysis.crosstalk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fourier_embeddings"]

# Pin torch to a CUDA 12.4 build: this WSL box's NVIDIA driver reports CUDA
# 12.8 (too old for the CUDA-13 wheels PyPI serves by default as of torch
# 2.13); cu124 wheels run under any driver >= the one that ships CUDA 12.4
# support, which this driver satisfies. On the A6000 box, re-run `uv sync`
# after checking `nvidia-smi`'s CUDA Version line against
# https://pytorch.org/get-started/locally/ -- a newer driver there can use a
# newer/default index instead.
[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
