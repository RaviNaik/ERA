[project]
name = "fourier-embeddings"
version = "0.1.0"
description = "Kronecker vs. Fourier-Kronecker byte-level embeddings: a controlled transformer LM comparison"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.20",
    "aim>=3.25",
    "numpy>=1.26",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "pytest>=8.0",
]

[project.scripts]
fe-download-data = "fourier_embeddings.data.download:main"
fe-train-tokenizer = "fourier_embeddings.data.tokenizer:main"
fe-pack-dataset = "fourier_embeddings.data.dataset:main"
fe-train = "fourier_embeddings.training.train:main"
fe-run-experiment = "fourier_embeddings.training.run_experiment:main"
fe-collisions = "fourier_embeddings.analysis.collisions:main"
fe-order-sensitivity = "fourier_embeddings.analysis.order_sensitivity:main"
fe-crosstalk = "fourier_embeddings.analysis.crosstalk:main"
fe-report-figures = "fourier_embeddings.analysis.report_figures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fourier_embeddings"]

# Pin torch to a CUDA 12.1 build. PyPI's default `torch` wheel as of torch
# 2.13 needs a CUDA-13-capable driver, which neither dev machine this project
# has been run on has: the WSL box's driver reports CUDA Version 12.8, and
# the A6000 box's driver reports CUDA Version 12.2 (`nvidia-smi`'s top-right
# field on each). A driver only runs wheels built against its own CUDA
# version *or older* (backward-compatible, not forward), so the pin has to
# satisfy the *lowest* CUDA Version seen across every machine that will
# `uv sync` this project -- cu121 clears both of the above with room to
# spare. If `nvidia-smi` on a new machine reports a CUDA Version below 12.1,
# lower this further; if every machine you use reports something newer,
# raising it (e.g. to cu124/cu126) gets a more current torch release.
# After changing this, run `uv sync` again and verify with:
#   uv run python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
#
# This pin uses the named/explicit-index syntax ([[tool.uv.index]] +
# explicit = true), added in uv 0.4.23 (Oct 2024). A `uv` older than that
# doesn't error on this block -- it silently ignores the whole thing and
# resolves plain `torch` from PyPI instead, which is a much worse failure
# mode than an error: `uv sync` reports success and `torch` installs, just
# the wrong CUDA build, so nothing looks wrong until `torch.cuda.is_available()`
# quietly returns False at training time. `required-version` below at least
# turns that into a loud failure on any `uv` new enough to understand
# `required-version` itself (added earlier than 0.4.23); on something as old
# as 0.4.11 even `required-version` is silently ignored -- if `uv --version`
# is that old, upgrade it first (`uv self update`, or the installer at
# https://astral.sh/uv/install.sh) before anything else in this file can be
# trusted to take effect.
[tool.uv]
required-version = ">=0.4.23"

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
