[project]
name = "reversible-llm-experiments"
version = "0.1.0"
description = "Session 13: 20M-parameter LLM training with reversible transformer variants."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "aim>=3.19",
    "datasets>=2.19",
    "tiktoken>=0.7",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/revllm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"