[project]
name = "session11"
version = "0.1.0"
description = "Session 11 assignment: understanding Adam/AdamW by hand, bias correction, warmup and the update-to-weight ratio, cosine vs WSD schedules, and learning-rate transfer across width on a 10.77M nanoGPT trained on char-level Tiny Shakespeare."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "aim>=3.19",
    "tqdm>=4.66",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "tabulate>=0.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/s11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
