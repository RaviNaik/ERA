<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERA V5 Capstone Task Board</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dde1e7; --text: #1b2430; --muted: #5d6b7c;
  --accent: #2457d6; --accent-soft: #e3ebfc; --danger: #c62828; --danger-soft: #fdeaea; --warn: #a15c00; --warn-soft: #fff1d6;
  --ok: #1b7a3e; --ok-soft: #e0f4e8; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #1a2029; --surface-2: #212936; --border: #2d3746; --text: #e6ebf2; --muted: #93a1b4;
    --accent: #7ba2ff; --accent-soft: #1f2f55; --danger: #ff8a80; --danger-soft: #3a1f21; --warn: #ffc266; --warn-soft: #3a2d12;
    --ok: #6fd69a; --ok-soft: #163325; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #1a2029; --surface-2: #212936; --border: #2d3746; --text: #e6ebf2; --muted: #93a1b4;
  --accent: #7ba2ff; --accent-soft: #1f2f55; --danger: #ff8a80; --danger-soft: #3a1f21; --warn: #ffc266; --warn-soft: #3a2d12;
  --ok: #6fd69a; --ok-soft: #163325; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 16px 48px; }

header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); }
header.top .wrap { padding-bottom: 0; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin-right: 8px; }
.brand small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 14px 0 4px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; text-align: left; }
.stat:hover { border-color: var(--accent); }
.stat b { display: block; font-size: 22px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.bad b { color: var(--danger); } .stat.warn b { color: var(--warn); } .stat.good b { color: var(--ok); }
.progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0 0; }
.progress i { display: block; height: 100%; background: var(--ok); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; }
.toolbar input[type=search] { min-width: 220px; flex: 1 1 220px; }
.toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; }
.tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected=true] { background: var(--accent-soft); color: var(--accent); }
.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }

.banner { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner .spacer { flex: 1; }

/* board */
.board { display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 12px; align-items: start; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; min-height: 160px; display: flex; flex-direction: column; }
.col.over { outline: 2px dashed var(--accent); }
.col h3 { margin: 0; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; }
.col .cards { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--ws, var(--border)); border-radius: 10px; padding: 9px 10px; box-shadow: var(--shadow); cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card.dragging { opacity: .45; }
.card .t { font-weight: 600; margin: 0 0 6px; overflow-wrap: anywhere; }
.card .m { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); }
.card .id { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11px; }
.card.done .t { text-decoration: line-through; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.pill.high { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.medium { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.overdue { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.avatar { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 700; }
.chk-card { margin-right: 2px; }
.empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 6px; }

/* list */
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 980px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); cursor: pointer; white-space: nowrap; user-select: none; }
tr.row { cursor: pointer; } tr.row:hover td { background: var(--surface-2); }
tr.done td.title { text-decoration: line-through; color: var(--muted); }

/* schedule */
.group { margin: 0 0 18px; }
.group h3 { margin: 0 0 8px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.group h3 .count { color: var(--muted); font-weight: 500; }
.sched { display: grid; gap: 8px; }
.srow { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--ws, var(--border)); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.srow:hover { border-color: var(--accent); }
.srow .d { font-variant-numeric: tabular-nums; font-weight: 600; }
.srow .d small { display: block; color: var(--muted); font-weight: 500; }

/* drawer */
.overlay { position: fixed; inset: 0; background: rgba(10,14,20,.45); z-index: 40; display: none; }
.overlay.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--surface); border-left: 1px solid var(--border); z-index: 50; transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.drawer header h2 { margin: 0; font-size: 15px; flex: 1; }
.drawer .body { padding: 16px; overflow-y: auto; flex: 1; display: grid; gap: 14px; align-content: start; }
.drawer footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.field { display: grid; gap: 4px; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
.field textarea { min-height: 80px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2, .grid3 { grid-template-columns: 1fr; } .srow { grid-template-columns: 1fr; } }
.refs, .comments { display: grid; gap: 6px; }
.ref { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
.ref .k { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); min-width: 56px; }
.ref a { flex: 1; overflow-wrap: anywhere; }
.addref { display: grid; grid-template-columns: 90px 1fr 1fr auto; gap: 6px; }
.addref input, .addref select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); min-width: 0; }
.comment { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.comment .h { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 3px; }
.comment p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; }
.chip button { border: 0; background: transparent; cursor: pointer; color: inherit; padding: 0 0 0 2px; font-size: 14px; line-height: 1; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 80; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .15s; }
.toast.show { opacity: 1; }
.menu { position: relative; }
.menu .pop { position: absolute; right: 0; top: 110%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); min-width: 220px; padding: 6px; display: none; z-index: 30; }
.menu.open .pop { display: block; }
.menu .pop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.menu .pop button:hover { background: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); padding: 2px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">ERA V5 Capstone Task Board<small id="sub"></small></div>
      <div class="tabs" role="tablist" aria-label="View">
        <button role="tab" data-view="board" aria-selected="true">Board</button>
        <button role="tab" data-view="list" aria-selected="false">List</button>
        <button role="tab" data-view="schedule" aria-selected="false">Schedule</button>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="saveState" role="status" aria-live="polite">Loading&hellip;</span>
      <button class="btn" id="themeBtn" title="Toggle light and dark">Theme</button>
      <div class="menu" id="dataMenu">
        <button class="btn" id="dataBtn" aria-haspopup="true">Data &#9662;</button>
        <div class="pop" role="menu">
          <button id="reloadBtn">Reload from tasks.json</button>
          <button id="backupsBtn">Restore a backup&hellip;</button>
          <button id="exportJson">Download a copy (JSON)</button>
          <button id="importBtn" class="danger">Replace tasks.json from a file&hellip;</button>
        </div>
      </div>
      <button class="btn primary" id="newBtn">+ New task</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <section class="stats" id="stats" aria-label="Summary"></section>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search title, notes, labels, PR or commit" aria-label="Search">
    <select id="fWs" aria-label="Workstream"></select>
    <select id="fStatus" aria-label="Status"></select>
    <select id="fAssignee" aria-label="Assignee"></select>
    <select id="fWeek" aria-label="Week"></select>
    <select id="fType" aria-label="Type">
      <option value="">All types</option><option value="task">Tasks</option><option value="recurring">Recurring (daily/weekly)</option><option value="milestone">Milestones</option>
    </select>
    <label class="chk"><input type="checkbox" id="fMine"> Mine</label>
    <label class="chk"><input type="checkbox" id="fHideDone"> Hide complete</label>
    <button class="btn small" id="clearF">Clear filters</button>
  </div>
  <div class="legend" id="legend"></div>

  <div id="view"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Task details"></aside>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
(function () {
"use strict";

/* ---------- constants ---------- */
var THEME_KEY = "era-v5-taskboard-theme"; /* only the light/dark choice lives in the browser; all task data is in tasks.json */
var STATUSES = [
  { id: "todo", label: "Pending" },
  { id: "progress", label: "In progress" },
  { id: "review", label: "In review" },
  { id: "blocked", label: "Blocked" },
  { id: "done", label: "Complete" }
];
var PRIORITIES = ["high", "medium", "low"];
var TYPES = [{ id: "task", label: "Task" }, { id: "recurring", label: "Recurring" }, { id: "milestone", label: "Milestone" }];
var REF_KINDS = [{ id: "pr", label: "PR" }, { id: "commit", label: "Commit" }, { id: "issue", label: "Issue" }, { id: "comment", label: "Comment" }, { id: "link", label: "Link" }];
var WS_COLORS = ["#2457d6", "#c2410c", "#0f766e", "#7c3aed", "#b45309", "#be185d", "#4d7c0f", "#0369a1"];

/* ---------- state and persistence: every read and write goes to tasks.json through server.py ---------- */
var state = { rev: 0, me: "", repos: {}, workstreams: [], tasks: [] };
var ui = { view: "board", sort: { key: "due", dir: 1 }, openId: null, draft: null, loaded: false };
var filters = { q: "", ws: "", status: "", assignee: "", week: "", type: "", mine: false, hideDone: false };
var sync = { rev: 0, dirty: false, saving: false, conflict: false, timer: null, error: "" };

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function api(method, url, body) {
  var opts = { method: method, headers: { "X-Taskboard": "1" }, cache: "no-store" };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  return fetch(url, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; e.body = j; throw e; }
      return j;
    });
  });
}
function normalize(d) { d.repos = d.repos || {}; d.workstreams = d.workstreams || []; d.me = d.me || ""; d.tasks = d.tasks || []; return d; }
function loadData() {
  return api("GET", "/api/data").then(function (d) {
    state = normalize(d); sync.rev = d.rev || 0; sync.dirty = false; sync.conflict = false; ui.loaded = true; setSave("saved");
  });
}
function setSave(kind, msg) {
  var el = $("saveState"); if (!el) return;
  var map = { pending: ["Unsaved changes", "soon"], saving: ["Saving to tasks.json…", "soon"], saved: ["Saved to tasks.json", "ok"],
    conflict: ["tasks.json changed on disk", "overdue"], error: ["Not saved: " + (msg || "error"), "overdue"] };
  var m = map[kind] || map.saved; el.className = "pill " + m[1]; el.textContent = m[0]; el.dataset.kind = kind;
  el.title = kind === "error" ? "Click to retry" : "Rev " + sync.rev;
}
function save() { sync.dirty = true; setSave(sync.conflict ? "conflict" : "pending"); clearTimeout(sync.timer); sync.timer = setTimeout(function () { flush(false); }, 350); }
function flush(force) {
  if (sync.saving || !sync.dirty || (sync.conflict && !force)) return;
  sync.saving = true; sync.dirty = false; setSave("saving");
  var payload = clone(state); delete payload.rev;
  api("PUT", "/api/data", { baseRev: sync.rev, data: payload, force: force === true }).then(function (r) {
    sync.rev = r.rev; state.rev = r.rev; state.updated = r.updated; sync.saving = false; sync.conflict = false;
    if (sync.dirty) flush(false); else { setSave("saved"); renderBanner(); renderSub(); }
  }).catch(function (e) {
    sync.saving = false; sync.dirty = true;
    if (e.status === 409) { sync.conflict = true; setSave("conflict"); renderBanner(); }
    else setSave("error", e instanceof TypeError ? "server not reachable" : e.message);
  });
}
function checkDisk() {
  if (!ui.loaded) return;
  api("GET", "/api/rev").then(function (r) {
    if (r.rev === sync.rev) return;
    if (!sync.dirty && !sync.saving) { loadData().then(function () { render(); toast("tasks.json changed on disk: reloaded"); }); }
    else { sync.conflict = true; setSave("conflict"); renderBanner(); }
  }).catch(function () { /* server stopped: the next save reports it */ });
}

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function $(id) { return document.getElementById(id); }
function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function dayDiff(a, b) { return Math.round((Date.parse(a + "T00:00:00Z") - Date.parse(b + "T00:00:00Z")) / 86400000); }
function fmtDate(s) {
  if (!s) return "No date";
  var d = new Date(s + "T00:00:00Z");
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
}
function statusLabel(id) { var s = STATUSES.filter(function (x) { return x.id === id; })[0]; return s ? s.label : id; }
function nextId(prefix) {
  var max = 0;
  state.tasks.forEach(function (t) { var m = /^T-(\d+)$/.exec(t.id); if (m && +m[1] > max) max = +m[1]; });
  return prefix + "-" + String(max + 1).padStart(3, "0");
}
function initials(n) { return String(n).split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase(); }
function wsColor(ws) {
  var list = wsList(); var i = list.indexOf(ws);
  return WS_COLORS[(i < 0 ? 0 : i) % WS_COLORS.length];
}
function wsList() {
  var seen = (state.workstreams || []).slice();
  state.tasks.forEach(function (t) { if (t.workstream && seen.indexOf(t.workstream) < 0) seen.push(t.workstream); });
  return seen;
}
function allAssignees() {
  var seen = [];
  state.tasks.forEach(function (t) { (t.assignees || []).forEach(function (a) { if (seen.indexOf(a) < 0) seen.push(a); }); });
  if (state.me && seen.indexOf(state.me) < 0) seen.unshift(state.me);
  return seen.sort();
}
function refUrl(r) {
  var repo = state.repos[r.repo] || r.repo || "";
  if (r.kind === "link") return /^https?:\/\//i.test(r.ref) ? r.ref : "";
  if (!repo) return "";
  if (r.kind === "pr") return "https://github.com/" + repo + "/pull/" + encodeURIComponent(r.ref);
  if (r.kind === "issue") return "https://github.com/" + repo + "/issues/" + encodeURIComponent(r.ref);
  if (r.kind === "commit") return "https://github.com/" + repo + "/commit/" + encodeURIComponent(r.ref);
  if (r.kind === "comment") {
    var p = String(r.ref).split("#");
    return "https://github.com/" + repo + "/pull/" + encodeURIComponent(p[0]) + (p[1] ? "#" + encodeURIComponent(p[1]) : "");
  }
  return "";
}
function refLabel(r) {
  var repo = state.repos[r.repo] || r.repo || "";
  var short = repo.split("/")[1] || repo;
  if (r.kind === "pr") return "PR #" + r.ref + (short ? " (" + (r.repo in state.repos ? r.repo : short) + ")" : "");
  if (r.kind === "issue") return "Issue #" + r.ref + (short ? " (" + (r.repo in state.repos ? r.repo : short) + ")" : "");
  if (r.kind === "commit") return String(r.ref).slice(0, 7) + (short ? " (" + (r.repo in state.repos ? r.repo : short) + ")" : "");
  if (r.kind === "comment") return "Comment on #" + String(r.ref).split("#")[0];
  return r.ref;
}
function dueState(t) {
  if (!t.due || t.status === "done") return "";
  var d = dayDiff(t.due, todayStr());
  if (d < 0) return "overdue"; if (d <= 2) return "soon"; return "";
}
function dueBadge(t) {
  if (!t.due) return "";
  var d = dayDiff(t.due, todayStr()), st = dueState(t), txt = fmtDate(t.due);

/* ---------- filtering ---------- */
function visible() {

    if (filters.week && String(t.week) !== filters.week) return false;

function renderStats() {
  var t = state.tasks, today = todayStr();

    ["Blocked", blocked, blocked ? "bad" : "", { status: "blocked" }], ["Mine, open", mine, "", { mine: true, hideDone: true }],
    ["Unassigned", unassigned, unassigned ? "warn" : "", { assignee: "__none", hideDone: true }], ["Complete", done + " / " + total, "good", { status: "done" }]

      '<p style="margin:0;color:var(--muted)">The server copies tasks.json to the <code>backups</code> folder before it changes (at most one every 5 minutes, newest 40 kept) and always before an import or restore. Restoring first backs up the current file.</p>' +
      (r.backups.length ? r.backups.map(function (b) {
        return '<div class="ref"><span style="flex:1">' + esc(b.time) + ' &middot; ' + (b.tasks == null ? "unreadable" : b.tasks + " tasks") + '<br><small style="color:var(--muted)">' + esc(b.name) + '</small></span>' +
          '<button class="btn small" data-restore="' + esc(b.name) + '">Restore</button></div>';
      }).join("") : '<div class="empty">No backups yet. The first one appears after your next save.</div>') + "</div>";
    $("overlay").classList.add("open"); d.classList.add("open"); d.setAttribute("aria-hidden", "false");
  }).catch(function (e) { toast("Could not list backups: " + e.message); });
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var el = e.target;
  if (el.closest("[data-stop]")) return;
  var dn = el.closest("[data-done]");
  if (dn) { e.stopPropagation(); setStatus(dn.dataset.done, dn.checked ? "done" : "todo"); return; }
  var stat = el.closest("[data-stat]");
  if (stat) {
    var spec = $("stats").__cards[+stat.dataset.stat][3];
    filters = { q: "", ws: "", status: spec.status || "", assignee: spec.assignee || "", week: "", type: "", mine: !!spec.mine, hideDone: !!spec.hideDone };
    if (spec.od || spec.soon) { ui.view = "schedule"; filters.hideDone = true; }
    render(); return;
  }
  var th = el.closest("th[data-sort]");
  if (th) { var k = th.dataset.sort; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : 1 }; render(); return; }
  var act = el.closest("[data-act]");
  if (act) { doAct(act.dataset.act); return; }
  var rmA = el.closest("[data-rmassign]"); if (rmA) { ui.draft.assignees.splice(+rmA.dataset.rmassign, 1); renderChips(); return; }
  var rmR = el.closest("[data-rmref]"); if (rmR) { ui.draft.refs.splice(+rmR.dataset.rmref, 1); renderRefs(); return; }
  var rmC = el.closest("[data-rmcm]"); if (rmC) { ui.draft.comments.splice(+rmC.dataset.rmcm, 1); renderComments(); return; }
  var item = el.closest(".card, tr.row, .srow");
  if (item && item.dataset.id) { openDrawer(item.dataset.id); return; }
  if (!el.closest("#dataMenu")) $("dataMenu").classList.remove("open");
  if (el.id === "overlay") closeDrawer();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeDrawer(); $("dataMenu").classList.remove("open"); }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("card")) { e.preventDefault(); openDrawer(e.target.dataset.id); }
  if (e.key === "n" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$("drawer").classList.contains("open")) { e.preventDefault(); openDrawer(null, true); }
});
function doAct(a) {
  if (a === "closeDrawer") closeDrawer();
  else if (a === "saveTask") saveTask();
  else if (a === "markDone") { readForm(); ui.draft.status = "done"; saveTask(); }
  else if (a === "deleteTask") { if (confirm("Delete " + ui.draft.id + "? This cannot be undone.")) { state.tasks = state.tasks.filter(function (t) { return t.id !== ui.draft.id; }); save(); closeDrawer(); render(); toast("Deleted"); } }
  else if (a === "addRef") {
    var v = $("r_ref").value.trim(); if (!v) return;
    var kind = $("r_kind").value;
    if (kind !== "link" && kind !== "commit" && kind !== "comment") v = v.replace(/^#/, "");
    ui.draft.refs.push({ kind: kind, repo: $("r_repo").value, ref: v }); $("r_ref").value = ""; renderRefs();
  }
  else if (a === "addComment") {
    var tx = $("c_text").value.trim(); if (!tx) return;
    ui.draft.comments.push({ at: new Date().toISOString().slice(0, 16), by: state.me || "Me", text: tx }); $("c_text").value = ""; renderComments();
  }
  else if (a === "reloadFile") { clearTimeout(sync.timer); loadData().then(function () { renderBanner(); render(); toast("Loaded tasks.json"); }).catch(function (e) { toast("Could not load: " + e.message); }); }
  else if (a === "overwriteFile") { sync.conflict = false; sync.dirty = true; flush(true); toast("Saving your version over tasks.json (the old file is backed up)"); }
}
$("newBtn").addEventListener("click", function () { openDrawer(null, true); });
$("q").addEventListener("input", function () { filters.q = this.value; render(); $("q").focus(); var v = $("q"); v.setSelectionRange(v.value.length, v.value.length); });
[["fWs", "ws"], ["fStatus", "status"], ["fAssignee", "assignee"], ["fWeek", "week"], ["fType", "type"]].forEach(function (p) { $(p[0]).addEventListener("change", function () { filters[p[1]] = this.value; render(); }); });
$("fMine").addEventListener("change", function () { filters.mine = this.checked; render(); });
$("fHideDone").addEventListener("change", function () { filters.hideDone = this.checked; render(); });
$("clearF").addEventListener("click", function () { filters = { q: "", ws: "", status: "", assignee: "", week: "", type: "", mine: false, hideDone: false }; render(); });
document.querySelectorAll(".tabs button").forEach(function (b) { b.addEventListener("click", function () { ui.view = b.dataset.view; render(); }); });
$("dataBtn").addEventListener("click", function (e) { e.stopPropagation(); $("dataMenu").classList.toggle("open"); });
$("reloadBtn").addEventListener("click", function () {
  $("dataMenu").classList.remove("open");
  if ((sync.dirty || sync.saving) && !confirm("You have changes that are not saved yet. Load tasks.json anyway?")) return;
  clearTimeout(sync.timer);
  loadData().then(function () { render(); toast("Loaded tasks.json"); }).catch(function (e) { toast("Could not load: " + e.message); });
});
$("backupsBtn").addEventListener("click", function () { $("dataMenu").classList.remove("open"); openBackups(); });
$("exportJson").addEventListener("click", function () { download("taskboard-copy-" + todayStr() + ".json", JSON.stringify(state, null, 2) + "\n", "application/json"); $("dataMenu").classList.remove("open"); toast("Downloaded a copy"); });
$("importBtn").addEventListener("click", function () { $("file").click(); $("dataMenu").classList.remove("open"); });
$("file").addEventListener("change", function () {
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    var o = null; try { o = JSON.parse(String(r.result)); } catch (e) { /* reported below */ }
    if (!o || !Array.isArray(o.tasks)) { toast("That file is not a task board JSON file"); return; }
    if (!confirm("Replace tasks.json (" + state.tasks.length + " tasks) with this file (" + o.tasks.length + " tasks)? The current file is backed up first.")) return;
    state = normalize(o); sync.conflict = false; sync.dirty = true; flush(true); render(); toast("Replacing tasks.json");
  };
  r.readAsText(f); this.value = "";
});
document.addEventListener("click", function (e) {
  var rs = e.target.closest("[data-restore]"); if (!rs) return;
  if (!confirm("Restore " + rs.dataset.restore + "? The current tasks.json is backed up first.")) return;
  api("POST", "/api/restore", { name: rs.dataset.restore }).then(function () { return loadData(); })
    .then(function () { closeDrawer(); render(); toast("Backup restored"); }).catch(function (er) { toast("Restore failed: " + er.message); });
});
$("saveState").addEventListener("click", function () { if (this.dataset.kind === "error") { sync.dirty = true; flush(false); } });
$("themeBtn").addEventListener("click", function () {
  var cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var nxt = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem(THEME_KEY, nxt); } catch (e) { /* theme is optional */ }
});
try { var th = localStorage.getItem(THEME_KEY); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* theme is optional */ }

window.addEventListener("beforeunload", function (e) { if (sync.dirty || sync.saving) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") checkDisk(); });
window.addEventListener("focus", checkDisk);

function boot() {
  loadData().then(function () { render(); }).catch(function (e) {
    setSave("error", "server not reachable");
    $("view").innerHTML = '<div class="banner" style="display:block"><b>Cannot load tasks.json.</b> ' + esc(e instanceof TypeError ? "The task board server is not running." : e.message) +
      '<br>Start it from the <code>taskboard</code> folder with <code>python3 server.py</code> and the board opens at <code>http://127.0.0.1:8765/</code>. Opening <code>index.html</code> directly cannot read or write the data file.</div>';
  });
}
boot();
})();
</script>
</body>
</html>
