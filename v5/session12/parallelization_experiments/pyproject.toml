[project]
name = "zero-parallelism-lab"
version = "0.1.0"
description = "A real 32-process torch.distributed (CPU/gloo) simulation of ZeRO-0 through ZeRO-3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<2.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "pytest>=8.3",
    "tabulate>=0.9",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/zero_lab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
